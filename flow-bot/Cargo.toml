[package]
name = "flow-bot"
version = "0.2.5"
edition = "2024"
authors = ["KevinT3Hu"]
description = "An onebot-11 SDK that simplifies bot creation."
repository = "https://github.com/KevinT3Hu/flow-bot.git"
license = "AGPL-3.0-only"

[dependencies]
anyhow = { version = "1.0" }
async-trait = "0.1.89"
cap-std = { version = "4.0.2" }
chrono = { version = "0.4" }
clap = { version = "4.5.60", features = ["derive"] }
config = "0.15.19"
dashmap = "6.1"
flow-bot-extractor = { path = "../flow-bot-extractor" }
flow-bot-onebot11 = { path = "../flow-bot-onebot11", features = ["api"] }
futures = "0.3.32"
notify-debouncer-mini = { version = "0.7.0" }
reqwest = { version = "0.13.2", features = ["json"] }
rmp-serde = { version = "1.3" }
semver = { version = "1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = [
    "macros",
    "sync",
    "time",
    "rt-multi-thread",
] }
tokio-tungstenite = "0.28.0"
toml = "1.0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["v4"] }
wasmtime = { version = "42.0.1" }
wasmtime-wasi = { version = "42.0.1" }
wit-bindgen = "0.53.1"
witgen = "0.15.0"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["rt"] }

[features]
